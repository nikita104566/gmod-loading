<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JM-GM | Zombie Survival [RUS]</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Roboto:wght@400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #050705;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Изменен фон на "токсичный" зеленый и мрачный серый */
        .bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(68, 255, 0, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(46, 204, 113, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at center, #0a110a 0%, #050705 100%);
            /* Добавлен эффект шума/грязи для зомби-атмосферы */
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(68, 255, 0, 0.03) 2px, rgba(68, 255, 0, 0.03) 4px);
        }
        
        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        /* Иконка черепа/зомби */
        .zombie-icon {
            width: 90px;
            height: 90px;
            margin-bottom: 25px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(68, 255, 0, 0.6));
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        
        /* Название сервера - Токсичный градиент */
        .server-name {
            font-family: 'Russo One', sans-serif;
            font-size: 52px;
            background: linear-gradient(135deg, #44ff00 0%, #a8ff78 50%, #44ff00 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
            text-shadow: 0 0 40px rgba(68, 255, 0, 0.4);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        @keyframes shine {
            to { background-position: 200% center; }
        }
        
        .subtitle {
            color: #889988;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 50px;
            font-weight: 500;
        }
        
        /* Прогресс бар */
        .progress-wrapper {
            width: 450px;
            text-align: center;
        }
        
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(68, 255, 0, 0.1);
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #44ff00, #2ecc71);
            background-size: 200% 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.3s ease;
            animation: gradient 2s linear infinite, flicker 3s infinite;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            95% { opacity: 1; }
            96% { opacity: 0.8; }
            97% { opacity: 1; }
            98% { opacity: 0.5; }
            99% { opacity: 1; }
        }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #6a8a6a;
            height: 20px;
            max-width: 450px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        /* Карточка с картой */
        .map-card {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(10, 15, 10, 0.85);
            border: 1px solid rgba(68, 255, 0, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }
        
        .map-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #1e5c1e, #36a336);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        .map-info {
            display: flex;
            flex-direction: column;
        }
        
        .map-label {
            font-size: 11px;
            color: #5a7a5a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .map-name {
            font-size: 16px;
            color: #e0f0e0;
            font-weight: 700;
            margin-top: 2px;
        }
        
        /* Режим */
        .info-card {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(10, 15, 10, 0.85);
            border: 1px solid rgba(68, 255, 0, 0.2);
            border-radius: 12px;
            padding: 12px 20px;
            backdrop-filter: blur(10px);
            text-align: right;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }
        
        .info-card .label {
            font-size: 11px;
            color: #5a7a5a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .info-card .value {
            font-size: 16px;
            color: #44ff00;
            font-weight: 700;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        
        /* Советы */
        .tips {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(10, 15, 10, 0.7);
            border-left: 4px solid #44ff00;
            border-radius: 4px 8px 8px 4px;
            padding: 12px 18px;
            font-size: 14px;
            color: #9ab99a;
            backdrop-filter: blur(10px);
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            transition: opacity 0.5s ease;
        }
        
        .tips span {
            color: #a8ff78;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    
    <div class="tips" id="tips-container">
        ☣️ <span id="tip">Строй баррикады, чтобы сдержать натиск!</span>
    </div>
    
    <div class="info-card">
        <div class="label">Игровой режим</div>
        <div class="value">Zombie Survival</div>
    </div>
    
    <div class="container">
        <!-- SVG Иконка зараженного черепа -->
        <svg class="zombie-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5 C25 5 10 25 10 48 C10 65 18 78 28 85 L28 95 C28 97.76 30.24 100 33 100 L67 100 C69.76 100 72 97.76 72 95 L72 85 C82 78 90 65 90 48 C90 25 75 5 50 5 Z M32 58 C25.37 58 20 52.63 20 46 C20 39.37 25.37 34 32 34 C38.63 34 44 39.37 44 46 C44 52.63 38.63 58 32 58 Z M68 58 C61.37 58 56 52.63 56 46 C56 39.37 61.37 34 68 34 C74.63 34 80 39.37 80 46 C80 52.63 74.63 58 68 58 Z M50 80 C43 80 37 74 37 67 L63 67 C63 74 57 80 50 80 Z" fill="#44ff00" opacity="0.9"/>
            <circle cx="32" cy="46" r="6" fill="#050705"/>
            <circle cx="68" cy="46" r="6" fill="#050705"/>
        </svg>
        
        <div class="server-name">JM-GM | Zombie Survival</div>
        <div class="subtitle">Выживи любой ценой или стань одним из них</div>
        
        <div class="progress-wrapper">
            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>
            <div class="status" id="status">Поиск безопасной зоны...</div>
        </div>
    </div>
    
    <div class="map-card">
        <div class="map-icon">🧟</div>
        <div class="map-info">
            <div class="map-label">Локация заражения</div>
            <div class="map-name" id="mapname">Загрузка данных...</div>
        </div>
    </div>

    <script>
        // Советы для Zombie Survival
        const tips = [
            "Строй крепкие баррикады, чтобы сдержать натиск зомби!",
            "Целься в голову — это наносит максимальный урон.",
            "Держитесь вместе. Одиночки быстро пополняют ряды нежити.",
            "Не забывай использовать медикаменты для лечения товарищей.",
            "Покупай оружие, патроны и аптечки в арсенале за очки.",
            "Если тебя заразили, твоя цель — уничтожить выживших.",
            "Следи за индикатором прочности баррикад."
        ];
        
        let tipIndex = 0;
        const tipElement = document.getElementById('tip');
        const tipContainer = document.getElementById('tips-container');

        setInterval(() => {
            // Эффект затухания при смене текста
            tipContainer.style.opacity = 0;
            setTimeout(() => {
                tipIndex = (tipIndex + 1) % tips.length;
                tipElement.textContent = tips[tipIndex];
                tipContainer.style.opacity = 1;
            }, 500);
        }, 6000);
        
        // Базовые функции интеграции с GMod
        let filesTotal = 0;
        let filesLoaded = 0;

        function SetFilesTotal(total) { 
            filesTotal = total; 
        }
        
        function SetFilesNeeded(needed) {
            filesLoaded = filesTotal - needed;
            let percent = filesTotal > 0 ? (filesLoaded / filesTotal) * 100 : 0;
            document.getElementById('progress').style.width = percent + '%';
        }
        
        function DownloadingFile(file) {
            document.getElementById('status').textContent = 'Загрузка: ' + file;
        }
        
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('mapname').textContent = mapname || 'Неизвестная зона';
        }
        
        function SetStatusChanged(status) {
            document.getElementById('status').textContent = status;
        }
        
        // Тестовое отображение карты из URL (полезно при отладке в браузере)
        const params = new URLSearchParams(window.location.search);
        const mapFromUrl = params.get('mapname');
        if (mapFromUrl) {
            document.getElementById('mapname').textContent = mapFromUrl;
        }
    </script>
</body>
</html>
