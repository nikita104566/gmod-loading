<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Murder Mystery [RUS]</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Syne:wght@500;700;800&display=swap');

        :root {
            --blood: #9b1c2e;
            --blood-bright: #d42a3d;
            --amber: #d4a574;
            --fog: #c8b8a8;
            --ink: #0c0a09;
            /* Зона ванильного прогресс-бара GMod (низ справа) */
            --gmod-bar-h: 110px;
            --gmod-bar-w: min(460px, 48vw);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--ink);
            color: var(--fog);
            font-family: 'Syne', sans-serif;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            isolation: isolate;
            /* Весь контент выше прогресс-бара GMod */
            padding-bottom: var(--gmod-bar-h);
        }

        .atmosphere {
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 55% at 78% 50%, rgba(155, 28, 46, 0.22) 0%, transparent 58%),
                radial-gradient(ellipse 45% 40% at 18% 25%, rgba(212, 165, 116, 0.07) 0%, transparent 50%),
                linear-gradient(180deg, #161012 0%, #0c0a09 55%, #080607 100%);
        }

        .atmosphere::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent 0,
                transparent 3px,
                rgba(255, 255, 255, 0.012) 3px,
                rgba(255, 255, 255, 0.012) 4px
            );
            pointer-events: none;
        }

        .atmosphere::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 40% 45%, transparent 30%, rgba(0, 0, 0, 0.72) 100%);
            pointer-events: none;
        }

        .mist {
            position: absolute;
            inset: -15%;
            z-index: 1;
            background:
                radial-gradient(ellipse 30% 18% at 25% 75%, rgba(200, 184, 168, 0.06), transparent 70%),
                radial-gradient(ellipse 35% 22% at 80% 40%, rgba(155, 28, 46, 0.1), transparent 70%);
            animation: mistDrift 20s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes mistDrift {
            from { transform: translate(-2%, 1%); }
            to { transform: translate(2%, -2%); }
        }

        .blade-wrap {
            position: absolute;
            z-index: 2;
            right: clamp(-2%, 2vw, 4%);
            top: 46%;
            transform: translateY(-50%);
            width: min(38vw, 340px);
            height: min(78vh, 600px);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .blade {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
            animation: bladeFloat 8s ease-in-out infinite;
            opacity: 0.92;
        }

        @keyframes bladeFloat {
            0%, 100% { transform: translateY(0) rotate(-18deg); }
            50% { transform: translateY(-10px) rotate(-15deg); }
        }

        .blade .tip-bead {
            /* лёгкое пульсирование без смещения позиции */
            animation: beadPulse 2.4s ease-in-out infinite;
        }

        @keyframes beadPulse {
            0%, 100% { opacity: 0.92; }
            45% { opacity: 1; }
        }

        .copy {
            position: absolute;
            z-index: 5;
            left: clamp(1.5rem, 5vw, 4.5rem);
            top: 50%;
            transform: translateY(-54%);
            width: min(520px, 48vw);
            text-align: left;
        }

        .eyebrow {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(0.8rem, 1.4vw, 1rem);
            font-style: italic;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 1rem;
            opacity: 0;
            animation: riseIn 1s 0.1s ease forwards;
        }

        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: clamp(3rem, 7.5vw, 5.6rem);
            line-height: 0.92;
            color: #f3ebe3;
            letter-spacing: 0.02em;
            text-shadow: 0 0 50px rgba(155, 28, 46, 0.28);
            opacity: 0;
            animation: riseIn 1s 0.25s ease forwards;
        }

        .brand em {
            display: block;
            font-style: italic;
            font-weight: 500;
            color: var(--blood-bright);
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 1.9vw, 1.25rem);
            font-style: italic;
            color: rgba(200, 184, 168, 0.78);
            margin: 1.1rem 0 2.2rem;
            max-width: 22em;
            line-height: 1.35;
            opacity: 0;
            animation: riseIn 1s 0.4s ease forwards;
        }

        .tagline strong {
            color: var(--blood-bright);
            font-weight: 500;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .load {
            width: min(360px, 100%);
            opacity: 0;
            animation: riseIn 1s 0.55s ease forwards;
        }

        .load-track {
            height: 2px;
            background: rgba(243, 235, 227, 0.08);
            position: relative;
        }

        .load-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6e1420, var(--blood-bright), #ff6b7a);
            box-shadow: 0 0 16px rgba(212, 42, 61, 0.5);
            transition: width 0.28s ease;
            position: relative;
        }

        .load-bar::after {
            content: "";
            position: absolute;
            right: -1px;
            top: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff5f5;
            transform: translateY(-50%);
            box-shadow: 0 0 8px var(--blood-bright);
        }

        .status {
            margin-top: 0.85rem;
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(200, 184, 168, 0.5);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tip-inline {
            margin-top: 1.4rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(212, 165, 116, 0.18);
            opacity: 0;
            animation: riseIn 1s 0.7s ease forwards;
        }

        .tip-label {
            font-size: 0.62rem;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: rgba(212, 165, 116, 0.65);
            margin-bottom: 0.4rem;
        }

        .tip-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(0.95rem, 1.5vw, 1.12rem);
            font-style: italic;
            color: rgba(243, 235, 227, 0.85);
            line-height: 1.4;
            max-width: 22em;
            transition: opacity 0.45s ease;
        }

        .tip-text.is-fading { opacity: 0; }

        /* Карта / режим — ниже полоски, без пересечения текста */
        .footer {
            position: absolute;
            z-index: 6;
            left: 0;
            right: var(--gmod-bar-w);
            bottom: calc(var(--gmod-bar-h) + 0.2rem);
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 2.5rem;
            padding: 0 clamp(1.5rem, 5vw, 4.5rem);
            background: none;
        }

        .meta-pair { min-width: 0; }

        .meta-label {
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(212, 165, 116, 0.72);
            margin-bottom: 0.3rem;
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }

        .meta-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #f3ebe3;
            line-height: 1.2;
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }

        .meta-value.mode { color: var(--blood-bright); }

        .rule {
            position: absolute;
            left: clamp(1.5rem, 5vw, 4.5rem);
            width: min(360px, 40vw);
            /* Над блоком карты/режима (~2.6rem высотой) */
            bottom: calc(var(--gmod-bar-h) + 2.85rem);
            height: 1px;
            background: linear-gradient(90deg, rgba(212, 165, 116, 0.28), transparent 70%);
            z-index: 6;
        }

        @media (max-width: 820px) {
            .blade-wrap {
                right: -8%;
                width: 46vw;
                opacity: 0.55;
            }
            .copy {
                width: min(520px, 70vw);
            }
            .footer {
                right: 0;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="atmosphere"></div>
        <div class="mist"></div>

        <div class="blade-wrap" aria-hidden="true">
            <svg class="blade" viewBox="0 0 200 560" xmlns="http://www.w3.org/2000/svg" overflow="visible">
                <defs>
                    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#4a4644"/>
                        <stop offset="22%" stop-color="#cfc7be"/>
                        <stop offset="48%" stop-color="#f7f2eb"/>
                        <stop offset="70%" stop-color="#9e968e"/>
                        <stop offset="100%" stop-color="#3a3634"/>
                    </linearGradient>
                    <linearGradient id="steelEdge" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </linearGradient>
                    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#1c110c"/>
                        <stop offset="35%" stop-color="#6a4228"/>
                        <stop offset="65%" stop-color="#4a2e1c"/>
                        <stop offset="100%" stop-color="#160e0a"/>
                    </linearGradient>
                    <linearGradient id="bolsterGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#2a2422"/>
                        <stop offset="40%" stop-color="#5a524c"/>
                        <stop offset="100%" stop-color="#1a1614"/>
                    </linearGradient>
                    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#e03346"/>
                        <stop offset="100%" stop-color="#6a101c"/>
                    </linearGradient>
                    <clipPath id="bladeClip">
                        <path d="M78 176 L122 176 L128 210 L124 420 C122 460 114 500 100 538 C86 500 78 460 76 420 L72 210 Z"/>
                    </clipPath>
                    <filter id="knifeShadow" x="-30%" y="-10%" width="160%" height="120%">
                        <feDropShadow dx="6" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
                    </filter>
                </defs>

                <g filter="url(#knifeShadow)">
                    <ellipse cx="100" cy="36" rx="18" ry="10" fill="#1a1412"/>
                    <ellipse cx="100" cy="34" rx="11" ry="5" fill="#d4a574" opacity="0.35"/>

                    <path d="M84 40 C84 40 82 48 82 56 L80 150 L120 150 L118 56 C118 48 116 40 116 40 Z" fill="url(#wood)"/>
                    <path d="M88 55 L112 55 M87 85 L113 85 M86 115 L114 115" fill="none" stroke="#120c08" stroke-width="1.4" opacity="0.5"/>
                    <circle cx="100" cy="70" r="4.2" fill="#1a100c"/>
                    <circle cx="100" cy="70" r="2.4" fill="#d4a574"/>
                    <circle cx="100" cy="100" r="4.2" fill="#1a100c"/>
                    <circle cx="100" cy="100" r="2.4" fill="#d4a574"/>
                    <circle cx="100" cy="130" r="4.2" fill="#1a100c"/>
                    <circle cx="100" cy="130" r="2.4" fill="#d4a574"/>

                    <path d="M70 148 L130 148 L134 168 L128 178 L72 178 L66 168 Z" fill="url(#bolsterGrad)"/>
                    <path d="M72 152 L128 152" stroke="#d4a574" stroke-width="1.5" opacity="0.45"/>
                    <path d="M74 172 L126 172" stroke="#000" stroke-width="1" opacity="0.35"/>

                    <path d="M78 176 L122 176 L128 210 L124 420 C122 460 114 500 100 538 C86 500 78 460 76 420 L72 210 Z" fill="url(#steel)"/>
                    <path d="M122 178 L126 212 L122 418" fill="none" stroke="#2a2624" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
                    <path d="M108 190 L116 250 L114 400 L108 470" fill="none" stroke="url(#steelEdge)" stroke-width="3" stroke-linecap="round"/>
                    <path d="M100 195 L100 430" fill="none" stroke="#1a1816" stroke-width="4" stroke-linecap="round" opacity="0.22"/>
                    <path d="M100 195 L100 420" fill="none" stroke="#fff8f0" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

                    <!-- Пятна лежат на металле и обрезаются строго по контуру клинка -->
                    <g clip-path="url(#bladeClip)">
                        <path d="M88 474 C94 470 101 476 104 484 C108 494 106 507 101 520
                                 C98 527 99 533 100 538 C94 531 90 520 87 508
                                 C84 496 82 482 88 474 Z"
                              fill="url(#blood)" opacity="0.94"/>
                        <path d="M103 451 C108 447 114 450 115 456 C116 462 111 467 106 465
                                 C101 463 99 455 103 451 Z"
                              fill="#9f1829" opacity="0.88"/>
                        <ellipse cx="96" cy="461" rx="5.8" ry="8.2" fill="#bd2034" opacity="0.9"/>
                        <ellipse cx="111" cy="476" rx="4.8" ry="6.8" fill="#7f1220" opacity="0.84"/>
                        <ellipse cx="91" cy="486" rx="4.2" ry="5.7" fill="#d02a3d" opacity="0.9"/>
                        <circle cx="108" cy="493" r="4.5" fill="#9a1727" opacity="0.86"/>
                        <circle cx="95" cy="506" r="3.8" fill="#e03346" opacity="0.84"/>
                        <path d="M111 466 C115 478 111 489 106 499" fill="none"
                              stroke="#e13a4b" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
                    </g>
                </g>

                <!-- Кровь: animateMotion сам поворачивает каплю по касательной к кривой -->
                <g class="blood-tip" transform="translate(100, 538)">
                    <g opacity="0">
                        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.72;1" dur="2.5s" repeatCount="indefinite"/>
                        <animateMotion path="M 0 3 C -5 16, -17 42, -48 104"
                            rotate="auto" dur="2.5s" repeatCount="indefinite"
                            calcMode="spline" keyTimes="0;1" keySplines="0.35 0 0.75 1"/>
                        <!-- Острие слева остаётся сзади, округлая часть справа ведёт каплю -->
                        <path d="M-10 0 C-5-4.2 1-4.6 5-2.6 C7-1.5 7 1.5 5 2.6 C1 4.6-5 4.2-10 0Z" fill="#d42a3d"/>
                    </g>
                    <g opacity="0">
                        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.72;1" dur="2.85s" begin="0.85s" repeatCount="indefinite"/>
                        <animateMotion path="M 0 3 C -4 15, -16 40, -52 110"
                            rotate="auto" dur="2.85s" begin="0.85s" repeatCount="indefinite"
                            calcMode="spline" keyTimes="0;1" keySplines="0.35 0 0.75 1"/>
                        <path d="M-8.5 0 C-4-3.5 1-3.8 4.2-2.2 C5.8-1.2 5.8 1.2 4.2 2.2 C1 3.8-4 3.5-8.5 0Z" fill="#c41f35"/>
                    </g>
                    <g opacity="0">
                        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.72;1" dur="2.55s" begin="1.55s" repeatCount="indefinite"/>
                        <animateMotion path="M 0 3 C -4 13, -14 35, -44 96"
                            rotate="auto" dur="2.55s" begin="1.55s" repeatCount="indefinite"
                            calcMode="spline" keyTimes="0;1" keySplines="0.35 0 0.75 1"/>
                        <path d="M-7.5 0 C-4-3 0.8-3.2 3.7-1.9 C5-1 5 1 3.7 1.9 C0.8 3.2-4 3-7.5 0Z" fill="#e03346"/>
                    </g>
                </g>
            </svg>
        </div>

        <div class="copy">
            <p class="eyebrow">Никому нельзя верить</p>
            <h1 class="brand">Murder <em>Mystery</em></h1>
            <p class="tagline">Один нож. Один пистолет. <strong>Двадцать четыре</strong> подозреваемых.</p>

            <div class="load">
                <div class="load-track">
                    <div class="load-bar" id="progress"></div>
                </div>
                <p class="status" id="status">Готовим раунд…</p>
            </div>

            <div class="tip-inline">
                <div class="tip-label">Подсказка</div>
                <p class="tip-text" id="tip">Слушай шаги — убийца оставляет следы.</p>
            </div>
        </div>

        <div class="rule"></div>

        <div class="footer">
            <div class="meta-pair">
                <div class="meta-label">Карта</div>
                <div class="meta-value" id="mapname">—</div>
            </div>
            <div class="meta-pair">
                <div class="meta-label">Режим</div>
                <div class="meta-value mode" id="gamemode">Murder Mystery</div>
            </div>
        </div>
    </div>

    <script>
        const tips = [
            "Слушай шаги — убийца оставляет следы.",
            "Детектив видит контуры тел. Не трать выстрел зря.",
            "Врач лечит союзников, но тоже может стать жертвой.",
            "Собирай лут — он может дать тебе оружие.",
            "Убийство невиновного наказывается. Целься точно.",
            "На большой игре убийц несколько — они знают друг друга.",
            "Не выдавай себя паникой. Спокойствие — маска.",
            "Фонарик выдаёт позицию. Пользуйся им осторожно."
        ];

        let tipIndex = 0;
        const tipEl = document.getElementById('tip');

        setInterval(() => {
            tipEl.classList.add('is-fading');
            setTimeout(() => {
                tipIndex = (tipIndex + 1) % tips.length;
                tipEl.textContent = tips[tipIndex];
                tipEl.classList.remove('is-fading');
            }, 450);
        }, 6500);

        let filesTotal = 0;

        function SetFilesTotal(total) {
            filesTotal = total || 0;
        }

        function SetFilesNeeded(needed) {
            const loaded = Math.max(0, filesTotal - (needed || 0));
            const percent = filesTotal > 0 ? (loaded / filesTotal) * 100 : 0;
            document.getElementById('progress').style.width = percent + '%';
        }

        function DownloadingFile(file) {
            document.getElementById('status').textContent = 'Загрузка: ' + file;
        }

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('mapname').textContent = mapname || 'Неизвестная карта';
            if (gamemode) {
                document.getElementById('gamemode').textContent = gamemode;
            }
        }

        function SetStatusChanged(status) {
            document.getElementById('status').textContent = status;
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('mapname')) {
            document.getElementById('mapname').textContent = params.get('mapname');
        }
    </script>
</body>
</html>
