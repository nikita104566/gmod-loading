<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Murder Mystery [RUS]</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Syne:wght@500;700;800&display=swap');

        :root {
            --blood: #9b1c2e;
            --blood-bright: #d42a3d;
            --amber: #d4a574;
            --fog: #c8b8a8;
            --ink: #0c0a09;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--ink);
            color: var(--fog);
            font-family: 'Syne', sans-serif;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            isolation: isolate;
        }

        .atmosphere {
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 55% at 78% 50%, rgba(155, 28, 46, 0.22) 0%, transparent 58%),
                radial-gradient(ellipse 45% 40% at 18% 25%, rgba(212, 165, 116, 0.07) 0%, transparent 50%),
                linear-gradient(180deg, #161012 0%, #0c0a09 55%, #080607 100%);
        }

        .atmosphere::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent 0,
                transparent 3px,
                rgba(255, 255, 255, 0.012) 3px,
                rgba(255, 255, 255, 0.012) 4px
            );
            pointer-events: none;
        }

        .atmosphere::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 40% 45%, transparent 30%, rgba(0, 0, 0, 0.72) 100%);
            pointer-events: none;
        }

        .mist {
            position: absolute;
            inset: -15%;
            z-index: 1;
            background:
                radial-gradient(ellipse 30% 18% at 25% 75%, rgba(200, 184, 168, 0.06), transparent 70%),
                radial-gradient(ellipse 35% 22% at 80% 40%, rgba(155, 28, 46, 0.1), transparent 70%);
            animation: mistDrift 20s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes mistDrift {
            from { transform: translate(-2%, 1%); }
            to   { transform: translate(2%, -2%); }
        }

        .blade-wrap {
            position: absolute;
            z-index: 2;
            right: clamp(-2%, 2vw, 4%);
            top: 50%;
            transform: translateY(-50%);
            width: min(38vw, 340px);
            height: min(82vh, 640px);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .blade {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
            animation: bladeFloat 8s ease-in-out infinite;
            opacity: 0.92;
        }

        @keyframes bladeFloat {
            0%, 100% { transform: translateY(0) rotate(12deg); }
            50%      { transform: translateY(-12px) rotate(10deg); }
        }

        .copy {
            position: absolute;
            z-index: 5;
            left: clamp(1.5rem, 5vw, 4.5rem);
            top: 50%;
            transform: translateY(-54%);
            width: min(520px, 48vw);
            text-align: left;
        }

        .eyebrow {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(0.8rem, 1.4vw, 1rem);
            font-style: italic;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 1rem;
            opacity: 0;
            animation: riseIn 1s 0.1s ease forwards;
        }

        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: clamp(3rem, 7.5vw, 5.6rem);
            line-height: 0.92;
            color: #f3ebe3;
            letter-spacing: 0.02em;
            text-shadow: 0 0 50px rgba(155, 28, 46, 0.28);
            opacity: 0;
            animation: riseIn 1s 0.25s ease forwards;
        }

        .brand em {
            display: block;
            font-style: italic;
            font-weight: 500;
            color: var(--blood-bright);
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 1.9vw, 1.25rem);
            font-style: italic;
            color: rgba(200, 184, 168, 0.78);
            margin: 1.1rem 0 2.2rem;
            max-width: 22em;
            line-height: 1.35;
            opacity: 0;
            animation: riseIn 1s 0.4s ease forwards;
        }

        .tagline strong {
            color: var(--blood-bright);
            font-weight: 500;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .load {
            width: min(360px, 100%);
            opacity: 0;
            animation: riseIn 1s 0.55s ease forwards;
        }

        .load-track {
            height: 2px;
            background: rgba(243, 235, 227, 0.08);
            position: relative;
        }

        .load-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6e1420, var(--blood-bright), #ff6b7a);
            box-shadow: 0 0 16px rgba(212, 42, 61, 0.5);
            transition: width 0.28s ease;
            position: relative;
        }

        .load-bar::after {
            content: "";
            position: absolute;
            right: -1px;
            top: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff5f5;
            transform: translateY(-50%);
            box-shadow: 0 0 8px var(--blood-bright);
        }

        .status {
            margin-top: 0.85rem;
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(200, 184, 168, 0.5);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .footer {
            position: absolute;
            z-index: 6;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 2rem;
            padding: 1.5rem clamp(1.5rem, 5vw, 4.5rem) 1.7rem;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.5));
        }

        .meta-label {
            font-size: 0.62rem;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: rgba(212, 165, 116, 0.65);
            margin-bottom: 0.3rem;
        }

        .meta-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #f3ebe3;
        }

        .meta-value.mode { color: var(--blood-bright); }

        .tip-block {
            text-align: right;
            max-width: min(400px, 46vw);
        }

        .tip-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(0.95rem, 1.5vw, 1.12rem);
            font-style: italic;
            color: rgba(243, 235, 227, 0.8);
            line-height: 1.35;
            transition: opacity 0.45s ease;
        }

        .tip-text.is-fading { opacity: 0; }

        .rule {
            position: absolute;
            left: clamp(1.5rem, 5vw, 4.5rem);
            right: clamp(1.5rem, 5vw, 4.5rem);
            bottom: 5.1rem;
            height: 1px;
            background: linear-gradient(90deg, rgba(212, 165, 116, 0.28), transparent 70%);
            z-index: 6;
        }

        @media (max-width: 820px) {
            .blade-wrap {
                right: -8%;
                width: 46vw;
                opacity: 0.55;
            }
            .copy { width: min(520px, 70vw); }
            .footer {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }
            .tip-block { text-align: left; max-width: none; }
            .rule { bottom: 8.2rem; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="atmosphere"></div>
        <div class="mist"></div>

        <div class="blade-wrap" aria-hidden="true">
            <svg class="blade" viewBox="0 0 180 520" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bladeFace" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#5a5552"/>
                        <stop offset="18%" stop-color="#d8d0c8"/>
                        <stop offset="42%" stop-color="#f4efe8"/>
                        <stop offset="58%" stop-color="#b8b0a6"/>
                        <stop offset="78%" stop-color="#7a7470"/>
                        <stop offset="100%" stop-color="#3e3a38"/>
                    </linearGradient>
                    <linearGradient id="bladeEdge" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#fff8f0" stop-opacity="0.85"/>
                        <stop offset="35%" stop-color="#fff8f0" stop-opacity="0.25"/>
                        <stop offset="100%" stop-color="#fff8f0" stop-opacity="0"/>
                    </linearGradient>
                    <linearGradient id="bloodDrop" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#d42a3d"/>
                        <stop offset="100%" stop-color="#6e1420"/>
                    </linearGradient>
                    <linearGradient id="handleWood" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#2a1810"/>
                        <stop offset="40%" stop-color="#5c3a24"/>
                        <stop offset="70%" stop-color="#3d2618"/>
                        <stop offset="100%" stop-color="#1a100c"/>
                    </linearGradient>
                    <filter id="softGlow" x="-20%" y="-10%" width="140%" height="120%">
                        <feGaussianBlur stdDeviation="2.5" result="b"/>
                        <feMerge>
                            <feMergeNode in="b"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <path d="M88 28 C92 28 98 36 102 52 L118 300 C120 318 116 340 108 365 L96 410 C94 418 90 430 88 442 C86 430 82 418 80 410 L68 365 C60 340 56 318 58 300 L74 52 C78 36 84 28 88 28 Z" fill="url(#bladeFace)" filter="url(#softGlow)"/>
                <path d="M96 55 L108 300 C109 315 106 335 100 355 L92 400" fill="none" stroke="url(#bladeEdge)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
                <path d="M88 70 L88 330" fill="none" stroke="#2a2624" stroke-width="3.5" stroke-linecap="round" opacity="0.28"/>
                <path d="M88 70 L88 320" fill="none" stroke="#fff8f0" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
                <path d="M88 448 C94 456 94 468 88 478 C82 468 82 456 88 448 Z" fill="url(#bloodDrop)" opacity="0.9"/>
                <ellipse cx="88" cy="486" rx="5" ry="3" fill="#6e1420" opacity="0.45"/>
                <rect x="54" y="298" width="68" height="16" rx="3" fill="#1a1412"/>
                <rect x="56" y="300" width="64" height="5" rx="1" fill="#d4a574" opacity="0.35"/>
                <rect x="58" y="308" width="60" height="3" fill="#3a2a22"/>
                <path d="M72 314 L104 314 L108 455 C108 468 100 478 88 478 C76 478 68 468 68 455 Z" fill="url(#handleWood)"/>
                <path d="M78 330 L98 330 M76 360 L100 360 M76 390 L100 390 M78 420 L98 420" fill="none" stroke="#1a100c" stroke-width="1.2" opacity="0.55"/>
                <circle cx="88" cy="348" r="4.5" fill="#2a1810"/>
                <circle cx="88" cy="348" r="2.6" fill="#d4a574"/>
                <circle cx="88" cy="388" r="4.5" fill="#2a1810"/>
                <circle cx="88" cy="388" r="2.6" fill="#d4a574"/>
                <circle cx="88" cy="428" r="4.5" fill="#2a1810"/>
                <circle cx="88" cy="428" r="2.6" fill="#d4a574"/>
                <ellipse cx="88" cy="478" rx="14" ry="8" fill="#1a1412"/>
                <ellipse cx="88" cy="476" rx="9" ry="4" fill="#d4a574" opacity="0.4"/>
            </svg>
        </div>

        <div class="copy">
            <div class="eyebrow">Никому нельзя верить</div>
            <h1 class="brand">Murder <em>Mystery</em></h1>
            <p class="tagline">Один нож. Один пистолет. <strong>Двадцать четыре подозреваемых.</strong></p>
            <div class="load">
                <div class="load-track"><div class="load-bar" id="progress"></div></div>
                <div class="status" id="status">Готовим раунд…</div>
            </div>
        </div>

        <div class="rule"></div>

        <div class="footer">
            <div class="meta">
                <div class="meta-label">Карта</div>
                <div class="meta-value" id="mapname">—</div>
                <div class="meta-label" style="margin-top:0.75rem">Режим</div>
                <div class="meta-value mode" id="gamemode">Murder Mystery</div>
            </div>
            <div class="tip-block">
                <div class="meta-label">Подсказка</div>
                <div class="tip-text" id="tip">Слушай шаги — убийца оставляет следы.</div>
            </div>
        </div>
    </div>

    <script>
        const tips = [
            "Слушай шаги — убийца оставляет следы.",
            "Детектив видит контуры тел. Не трать выстрел зря.",
            "Врач лечит союзников, но тоже может стать жертвой.",
            "Собирай лут — он может дать тебе оружие.",
            "Убийство невиновного наказывается. Целься точно.",
            "На большой игре убийц несколько — они знают друг друга.",
            "Не выдавай себя паникой. Спокойствие — маска.",
            "Фонарик выдаёт позицию. Пользуйся им осторожно."
        ];

        let tipIndex = 0;
        const tipEl = document.getElementById('tip');

        setInterval(() => {
            tipEl.classList.add('is-fading');
            setTimeout(() => {
                tipIndex = (tipIndex + 1) % tips.length;
                tipEl.textContent = tips[tipIndex];
                tipEl.classList.remove('is-fading');
            }, 450);
        }, 6500);

        let filesTotal = 0;
        function SetFilesTotal(total) { filesTotal = total || 0; }
        function SetFilesNeeded(needed) {
            const loaded = Math.max(0, filesTotal - (needed || 0));
            const percent = filesTotal > 0 ? (loaded / filesTotal) * 100 : 0;
            document.getElementById('progress').style.width = percent + '%';
        }
        function DownloadingFile(file) {
            document.getElementById('status').textContent = 'Загрузка: ' + file;
        }
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('mapname').textContent = mapname || 'Неизвестная карта';
            if (gamemode) document.getElementById('gamemode').textContent = gamemode;
        }
        function SetStatusChanged(status) {
            document.getElementById('status').textContent = status;
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('mapname')) {
            document.getElementById('mapname').textContent = params.get('mapname');
        }
    </script>
</body>
</html>
