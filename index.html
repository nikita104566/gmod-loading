<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Murder Mystery [RUS]</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Syne:wght@500;700;800&display=swap');

        :root {
            --blood: #9b1c2e;
            --blood-bright: #d42a3d;
            --amber: #d4a574;
            --fog: #c8b8a8;
            --ink: #0c0a09;
            --panel: rgba(18, 12, 14, 0.72);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--ink);
            color: var(--fog);
            font-family: 'Syne', sans-serif;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            isolation: isolate;
        }

        /* Полноэкранная атмосфера */
        .atmosphere {
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 90% 60% at 50% 110%, rgba(155, 28, 46, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 15% 20%, rgba(212, 165, 116, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 40% 50% at 85% 30%, rgba(155, 28, 46, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, #1a1214 0%, #0c0a09 55%, #080607 100%);
        }

        .atmosphere::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0,
                    transparent 3px,
                    rgba(255, 255, 255, 0.015) 3px,
                    rgba(255, 255, 255, 0.015) 4px
                );
            pointer-events: none;
            opacity: 0.7;
        }

        .atmosphere::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.75) 100%);
            pointer-events: none;
        }

        /* Медленный «туман» */
        .mist {
            position: absolute;
            inset: -20%;
            z-index: 1;
            background:
                radial-gradient(ellipse 35% 20% at 30% 70%, rgba(200, 184, 168, 0.07), transparent 70%),
                radial-gradient(ellipse 40% 25% at 70% 60%, rgba(155, 28, 46, 0.08), transparent 70%);
            animation: mistDrift 18s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes mistDrift {
            from { transform: translate(-2%, 1%) scale(1); }
            to   { transform: translate(3%, -2%) scale(1.05); }
        }

        /* Декоративный нож */
        .blade {
            position: absolute;
            z-index: 2;
            width: min(42vw, 280px);
            height: auto;
            opacity: 0.14;
            filter: blur(0.2px);
            animation: bladeFloat 7s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes bladeFloat {
            0%, 100% { transform: translateY(0) rotate(-18deg); }
            50%      { transform: translateY(-14px) rotate(-14deg); }
        }

        .content {
            position: relative;
            z-index: 5;
            width: min(920px, 92vw);
            text-align: center;
            padding: 2rem 1rem 6rem;
        }

        .eyebrow {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(0.85rem, 1.6vw, 1.05rem);
            font-style: italic;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 1.25rem;
            opacity: 0;
            animation: riseIn 1.1s 0.15s ease forwards;
        }

        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: clamp(3.2rem, 9vw, 6.5rem);
            line-height: 0.92;
            color: #f3ebe3;
            letter-spacing: 0.02em;
            margin-bottom: 0.35rem;
            text-shadow: 0 0 60px rgba(155, 28, 46, 0.35);
            opacity: 0;
            animation: riseIn 1.1s 0.3s ease forwards;
        }

        .brand em {
            font-style: italic;
            font-weight: 500;
            color: var(--blood-bright);
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.05rem, 2.2vw, 1.35rem);
            font-style: italic;
            color: rgba(200, 184, 168, 0.75);
            margin: 1rem auto 2.75rem;
            max-width: 28em;
            opacity: 0;
            animation: riseIn 1.1s 0.45s ease forwards;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Прогресс — «кровавая черта» */
        .load {
            width: min(420px, 85vw);
            margin: 0 auto;
            opacity: 0;
            animation: riseIn 1.1s 0.6s ease forwards;
        }

        .load-track {
            height: 2px;
            background: rgba(243, 235, 227, 0.08);
            position: relative;
            overflow: visible;
        }

        .load-track::before,
        .load-track::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--amber);
            transform: translateY(-50%);
            opacity: 0.55;
        }

        .load-track::before { left: -2px; }
        .load-track::after  { right: -2px; }

        .load-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6e1420, var(--blood-bright), #ff6b7a);
            box-shadow: 0 0 18px rgba(212, 42, 61, 0.55);
            transition: width 0.28s ease;
            position: relative;
        }

        .load-bar::after {
            content: "";
            position: absolute;
            right: -1px;
            top: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff5f5;
            transform: translateY(-50%);
            box-shadow: 0 0 10px var(--blood-bright);
            opacity: 0.9;
        }

        .status {
            margin-top: 1rem;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(200, 184, 168, 0.55);
            min-height: 1.2em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Низ: карта + совет — одна линия композиции */
        .footer {
            position: absolute;
            z-index: 6;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 2rem;
            padding: 1.75rem 2rem 1.85rem;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.55));
        }

        .meta {
            text-align: left;
        }

        .meta-label {
            font-size: 0.65rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(212, 165, 116, 0.65);
            margin-bottom: 0.35rem;
        }

        .meta-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #f3ebe3;
        }

        .meta-value.mode {
            color: var(--blood-bright);
        }

        .tip-block {
            text-align: right;
            max-width: min(420px, 48vw);
        }

        .tip-label {
            font-size: 0.65rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(212, 165, 116, 0.65);
            margin-bottom: 0.4rem;
        }

        .tip-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(0.95rem, 1.6vw, 1.15rem);
            font-style: italic;
            color: rgba(243, 235, 227, 0.82);
            line-height: 1.35;
            transition: opacity 0.45s ease;
        }

        .tip-text.is-fading { opacity: 0; }

        .rule {
            position: absolute;
            left: 2rem;
            right: 2rem;
            bottom: 5.4rem;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 165, 116, 0.25), transparent);
            z-index: 6;
        }

        @media (max-width: 720px) {
            .footer {
                flex-direction: column;
                align-items: stretch;
                gap: 1.1rem;
            }
            .tip-block, .meta { text-align: left; max-width: none; }
            .rule { bottom: 8.5rem; }
            .blade { width: 55vw; opacity: 0.1; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="atmosphere"></div>
        <div class="mist"></div>

        <svg class="blade" viewBox="0 0 120 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#f3ebe3"/>
                    <stop offset="55%" stop-color="#a89888"/>
                    <stop offset="100%" stop-color="#5a4a42"/>
                </linearGradient>
            </defs>
            <path d="M58 12 L66 12 L72 210 L60 298 L48 210 Z" fill="url(#steel)"/>
            <rect x="44" y="208" width="32" height="14" rx="2" fill="#3a2418"/>
            <rect x="52" y="222" width="16" height="48" rx="2" fill="#5c3a28"/>
            <circle cx="60" cy="248" r="3" fill="#d4a574"/>
        </svg>

        <div class="content">
            <div class="eyebrow">Никому нельзя верить</div>
            <h1 class="brand">Murder <em>Mystery</em></h1>
            <p class="tagline">Один нож. Один пистолет. Двадцать четыре подозреваемых.</p>

            <div class="load">
                <div class="load-track">
                    <div class="load-bar" id="progress"></div>
                </div>
                <div class="status" id="status">Готовим раунд…</div>
            </div>
        </div>

        <div class="rule"></div>

        <div class="footer">
            <div class="meta">
                <div class="meta-label">Карта</div>
                <div class="meta-value" id="mapname">—</div>
                <div class="meta-label" style="margin-top:0.85rem">Режим</div>
                <div class="meta-value mode" id="gamemode">Murder Mystery</div>
            </div>
            <div class="tip-block">
                <div class="tip-label">Подсказка</div>
                <div class="tip-text" id="tip">Слушай шаги — убийца оставляет следы.</div>
            </div>
        </div>
    </div>

    <script>
        const tips = [
            "Слушай шаги — убийца оставляет следы.",
            "Детектив видит контуры тел. Не трать выстрел зря.",
            "Врач лечит союзников, но тоже может стать жертвой.",
            "Собирай лут — он может дать тебе оружие.",
            "Убийство невиновного наказывается. Целься точно.",
            "На большой игре убийц несколько — они знают друг друга.",
            "Не выдавай себя паникой. Спокойствие — маска.",
            "Фонарик выдаёт позицию. Пользуйся им осторожно."
        ];

        let tipIndex = 0;
        const tipEl = document.getElementById('tip');

        setInterval(() => {
            tipEl.classList.add('is-fading');
            setTimeout(() => {
                tipIndex = (tipIndex + 1) % tips.length;
                tipEl.textContent = tips[tipIndex];
                tipEl.classList.remove('is-fading');
            }, 450);
        }, 6500);

        let filesTotal = 0;

        function SetFilesTotal(total) {
            filesTotal = total || 0;
        }

        function SetFilesNeeded(needed) {
            const loaded = Math.max(0, filesTotal - (needed || 0));
            const percent = filesTotal > 0 ? (loaded / filesTotal) * 100 : 0;
            document.getElementById('progress').style.width = percent + '%';
        }

        function DownloadingFile(file) {
            document.getElementById('status').textContent = 'Загрузка: ' + file;
        }

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('mapname').textContent = mapname || 'Неизвестная карта';
            if (gamemode) {
                document.getElementById('gamemode').textContent = gamemode;
            }
        }

        function SetStatusChanged(status) {
            document.getElementById('status').textContent = status;
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('mapname')) {
            document.getElementById('mapname').textContent = params.get('mapname');
        }
    </script>
</body>
</html>
